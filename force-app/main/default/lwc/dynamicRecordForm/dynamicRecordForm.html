<template>
    <lightning-card title={formTitle} icon-name={formIcon}>
        <div class="slds-p-around_medium slds-is-relative">
            
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
            </template>

            <template if:true={isFormActive}>
                
                <template if:true={formInstructions}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <lightning-formatted-rich-text value={formInstructions}></lightning-formatted-rich-text>
                    </div>
                </template>
                
                <template for:each={sections} for:item="sec">
                    <div key={sec.id} class={sec.sectionClass}>
                        
                        <div class="slds-grid slds-grid_vertical-align-center slds-theme_shade slds-border_top slds-border_bottom">
                            <div class="slds-col">
                                <h3 class="slds-section__title">
                                    <button aria-controls={sec.id} aria-expanded={sec.isExpanded} class="slds-button slds-section__title-action" data-id={sec.id} onclick={handleToggleSection} disabled={isLoading}>
                                        <lightning-icon icon-name="utility:switch" size="x-small" class="slds-section__title-action-icon slds-button__icon_left"></lightning-icon>
                                        <span class="slds-truncate" title={sec.label}>
                                            <abbr if:true={sec.isRequired} title="required" class="slds-required slds-m-right_xx-small">*</abbr>
                                            <b>{sec.label}</b>
                                        </span>
                                    </button>
                                </h3>
                            </div>
                            <div class="slds-col slds-no-flex slds-p-right_small">
                                <template if:true={sec.allowMultiple}>
                                    <lightning-button-icon icon-name="utility:add" variant="border-filled" data-id={sec.id} onclick={handleAddRow} alternative-text="Add Item" title="Add Item" disabled={isLoading}></lightning-button-icon>
                                </template>
                            </div>
                        </div>
                        
                        <div class="slds-section__content slds-p-around_small" id={sec.id}>
                            
                            <template if:true={sec.isMatrix}>
                                <div class="slds-scrollable_x">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th class="" scope="col"><div class="slds-truncate"></div></th>
                                                <template for:each={sec.matrixColumns} for:item="col">
                                                    <th key={col.key} class="" scope="col">
                                                        <div class="slds-truncate" title={col.label}>{col.label}</div>
                                                    </th>
                                                </template>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={sec.matrixRows} for:item="row">
                                                <tr key={row.key} class="slds-hint-parent">
                                                    <td data-label="Type">
                                                        <div class="slds-truncate" title={row.label}><strong>{row.label}</strong></div>
                                                    </td>
                                                    <template for:each={row.cells} for:item="cell">
                                                        <td key={cell.key}>
                                                            <template if:true={cell.isCheckbox}>
                                                                <div class="slds-checkbox">
                                                                    <input type="checkbox" name={cell.key} id={cell.key} checked={cell.displayValue} data-section={sec.id} data-row={row.key} data-col={cell.colKey} disabled={cell.isReadOnly} onchange={handleMatrixChange} />
                                                                    <label class="slds-checkbox__label" for={cell.key}><span class="slds-checkbox_faux"></span></label>
                                                                </div>
                                                            </template>
                                                            <template if:true={cell.isStandard}>
                                                                <input type={cell.inputType} class="slds-input" value={cell.value} data-section={sec.id} data-row={row.key} data-col={cell.colKey} disabled={cell.isReadOnly} onblur={handleMatrixChange} />
                                                            </template>
                                                        </td>
                                                    </template>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <template if:true={sec.isStandardSection}>
                                <template for:each={sec.rows} for:item="row">
                                    <div key={row.id} class="slds-box slds-theme_default slds-m-bottom_small" style="background-color: #fcfcfc;">
                                        
                                        <template if:true={sec.allowMultiple}>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-border_bottom slds-p-bottom_x-small slds-m-bottom_small">
                                                <div class="slds-text-title_caps slds-text-color_weak">{row.label}</div>
                                                <div class="slds-col_bump-left">
                                                    <template if:true={row.isRemovable}>
                                                        <lightning-button-icon icon-name="utility:delete" variant="bare" size="small" data-rowid={row.id} data-secid={sec.id} onclick={handleRemoveRow} alternative-text="Remove Item" class="slds-text-color_error" disabled={isLoading}></lightning-button-icon>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>

                                        <lightning-layout multiple-rows="true">
                                            <template for:each={row.fields} for:item="field">
                                                
                                                <lightning-layout-item class={field.cssDisplayClass} key={field.apiName} size="12" small-device-size={field.gridSize} padding="horizontal-small">
                                                    
                                                    <template if:true={field.isHeader}>
                                                        <div class="slds-col slds-size_12-of-12 slds-m-top_small slds-m-bottom_x-small slds-border_bottom">
                                                            <h3 class="slds-text-heading_small slds-text-color_default"><b>{field.label}</b></h3>
                                                        </div>
                                                    </template>

                                                    <template if:true={field.isDisplayText}>
                                                        <div class="slds-col slds-size_12-of-12 slds-m-top_small slds-m-bottom_small">
                                                            <lightning-formatted-rich-text value={field.htmlContent}></lightning-formatted-rich-text>
                                                        </div>
                                                    </template>

                                                    <template if:true={field.isCheckbox}>
                                                        <lightning-input type="checkbox" label={field.label} data-api={field.apiName} data-row={row.id} data-secid={sec.id} checked={field.currentValue} required={field.required} disabled={field.isReadOnly} onchange={handleFieldChange} class="slds-m-bottom_xx-small"></lightning-input>
                                                        <template if:true={field.helpText}><div class="slds-form-element__help slds-m-bottom_small" style="margin-top: -0.25rem; font-size: 0.7rem;">{field.helpText}</div></template>
                                                    </template>

                                                    <template if:true={field.isStandard}>
                                                        <lightning-input type={field.uiType} label={field.label} data-api={field.apiName} data-row={row.id} data-secid={sec.id} required={field.required} value={field.currentValue} disabled={field.isReadOnly} onchange={handleFieldChange} class="slds-m-bottom_xx-small"></lightning-input>
                                                        <template if:true={field.helpText}><div class="slds-form-element__help slds-m-bottom_small" style="margin-top: -0.5rem; font-size: 0.7rem;">{field.helpText}</div></template>
                                                    </template>
                
                                                    <template if:true={field.isPicklist}>
                                                        <lightning-combobox label={field.label} data-api={field.apiName} data-row={row.id} data-secid={sec.id} required={field.required} value={field.currentValue} options={field.filteredOptions} disabled={field.isReadOnly} onchange={handleFieldChange} class="slds-m-bottom_xx-small"></lightning-combobox>
                                                        <template if:true={field.helpText}><div class="slds-form-element__help slds-m-bottom_small" style="margin-top: -0.5rem; font-size: 0.7rem;">{field.helpText}</div></template>
                                                    </template>

                                                    <template if:true={field.isMultiSelect}>
                                                        <lightning-dual-listbox label={field.label} source-label="Available" selected-label="Selected" data-api={field.apiName} data-row={row.id} data-secid={sec.id} options={field.filteredOptions} value={field.currentValue} required={field.required} disabled={field.isReadOnly} onchange={handleFieldChange} class="slds-m-bottom_xx-small"></lightning-dual-listbox>
                                                        <template if:true={field.helpText}><div class="slds-form-element__help slds-m-bottom_small" style="margin-top: -0.5rem; font-size: 0.7rem;">{field.helpText}</div></template>
                                                    </template>
                
                                                    <template if:true={field.isLookup}>
                                                        <div class="slds-form-element slds-m-bottom_xx-small">
                                                            <label class="slds-form-element__label">
                                                                <abbr if:true={field.required} title="required" class="slds-required">*</abbr>
                                                                {field.label}
                                                                <template if:true={field.currentDetails}>
                                                                    <lightning-helptext content={field.currentDetails} icon-name="utility:info" class="slds-m-left_xx-small"></lightning-helptext>
                                                                </template>
                                                            </label>
                                                            <div class="slds-form-element__control">
                                                                <div class="slds-combobox_container">
                                                                    <div class={field.lookupClass}>
                                                                        <div class="slds-combobox__form-element" role="none">
                                                                            <lightning-input type="search" data-api={field.apiName} data-row={row.id} data-secid={sec.id} value={field.currentValue} required={field.required} disabled={field.isReadOnly} onchange={handleLookupSearch} onblur={handleBlur} placeholder="Search..." variant="label-hidden"></lightning-input>
                                                                        </div>
                                                                        <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
                                                                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                                                <template for:each={field.lookupOptions} for:item="opt">
                                                                                    <li key={opt.id} role="presentation" class="slds-listbox__item" data-api={field.apiName} data-row={row.id} data-id={opt.id} data-label={opt.label} data-details={opt.details} onmousedown={handleLookupSelect}>
                                                                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
                                                                                            <span class="slds-media__figure slds-listbox__option-icon"><lightning-icon icon-name="standard:record" size="small"></lightning-icon></span>
                                                                                            <span class="slds-media__body">
                                                                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">{opt.label}</span>
                                                                                                <template if:true={opt.meta}><span class="slds-listbox__option-meta slds-listbox__option-meta_entity">{opt.meta}</span></template>
                                                                                            </span>
                                                                                        </div>
                                                                                    </li>
                                                                                </template>
                                                                            </ul>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <template if:true={field.helpText}><div class="slds-form-element__help slds-m-bottom_small" style="margin-top: -0.25rem; font-size: 0.7rem;">{field.helpText}</div></template>
                                                    </template>

                                                    <template if:true={field.isTextArea}>
                                                        <lightning-textarea label={field.label} data-api={field.apiName} data-row={row.id} data-secid={sec.id} required={field.required} value={field.currentValue} disabled={field.isReadOnly} onchange={handleFieldChange} class="slds-m-bottom_xx-small"></lightning-textarea>
                                                        <template if:true={field.helpText}><div class="slds-form-element__help slds-m-bottom_small" style="margin-top: -0.5rem; font-size: 0.7rem;">{field.helpText}</div></template>
                                                    </template>

                                                    <template if:true={field.isFileUpload}>
                                                        <template if:true={savedRecordId}>
                                                            <div class="slds-form-element slds-m-bottom_xx-small slds-box slds-box_x-small slds-theme_shade">
                                                                <label class="slds-form-element__label slds-m-bottom_x-small"><abbr if:true={field.required} title="required" class="slds-required">*</abbr>{field.label}</label>
                                                                
                                                                <template if:true={isLightningOut}>
                                                                    <lightning-input 
                                                                        type="file"
                                                                        label={field.label}
                                                                        variant="label-hidden"
                                                                        name={field.apiName}
                                                                        accept={field.acceptedFormats}
                                                                        required={field.required}
                                                                        data-row={row.id}
                                                                        data-secid={sec.id}
                                                                        data-api={field.apiName}
                                                                        onchange={handleCustomFileUpload}
                                                                        multiple
                                                                        disabled={isLoading}>
                                                                    </lightning-input>
                                                                </template>

                                                                <template if:false={isLightningOut}>
                                                                    <lightning-file-upload 
                                                                        name={field.apiName} 
                                                                        record-id={savedRecordId} 
                                                                        accept={field.acceptedFormats} 
                                                                        onuploadfinished={handleUploadFinished} 
                                                                        multiple 
                                                                        variant="label-hidden" 
                                                                        data-api={field.apiName} 
                                                                        data-row={row.id} 
                                                                        disabled={isLoading}>
                                                                    </lightning-file-upload>
                                                                </template>

                                                                <template if:true={field.uploadedFiles}>
                                                                    <div class="slds-m-top_x-small">
                                                                        <template for:each={field.uploadedFiles} for:item="file">
                                                                            <lightning-pill key={file.documentId} label={file.name} name={file.documentId} data-row={row.id} data-api={field.apiName} onremove={handleFileRemove}><lightning-icon icon-name="standard:file" alternative-text="File"></lightning-icon></lightning-pill>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                            <template if:true={field.helpText}><div class="slds-form-element__help slds-m-bottom_small" style="margin-top: -0.25rem; font-size: 0.7rem;">{field.helpText}</div></template>
                                                        </template>
                                                    </template>
                
                                                </lightning-layout-item>
                                            </template>
                                        </lightning-layout>
                                    </div>
                                </template>
                            </template> 
                        </div>
                    </div>
                </template>
    
                <div class="slds-align_absolute-center slds-m-top_large">
                    
                    <lightning-button variant="neutral" label={labels.cancel} onclick={handleCancel} class="slds-m-right_small" disabled={isLoading}></lightning-button>

                    <template if:true={showPrevButton}>
                        <lightning-button variant="neutral" label={labels.previous} onclick={handlePrevious} class="slds-m-right_small" disabled={isLoading}></lightning-button>
                    </template>

                    <template if:true={showNextButton}>
                        <lightning-button variant="brand" label={labels.next} onclick={handleNext} disabled={isLoading}></lightning-button>
                    </template>
                    <template if:true={isSubmitHidden}>
                        <lightning-button variant="brand" label={labels.finish} onclick={handleFinish} disabled={isLoading}></lightning-button>
                    </template>

                    <template if:false={isSubmitHidden}>
                        <template if:true={showStepButtons}>
                            <template if:true={hasRequiredUpload}>
                                <lightning-button variant="brand" label={labels.saveAndUpload} onclick={handleSubmit} disabled={isLoading}></lightning-button>
                            </template>
                            <template if:true={hasOptionalUpload}>
                                <template if:false={hasRequiredUpload}>
                                    <lightning-button variant="neutral" label={labels.saveAndFinish} data-mode="finish" onclick={handleSubmit} class="slds-m-right_small" disabled={isLoading}></lightning-button>
                                    <lightning-button variant="brand" label={labels.saveAndAttach} onclick={handleSubmit} disabled={isLoading}></lightning-button>
                                </template>
                            </template>
                        </template>

                        <template if:true={showSubmitButton}>
                            <lightning-button variant="brand" label={submitButtonLabel} data-mode="finish" onclick={handleSubmit} disabled={isLoading}></lightning-button>
                        </template>
                    </template>
                </div>
            </template>
            
            <template if:false={isFormActive}>
                <div class="slds-align_absolute-center slds-m-top_large">
                    <p class="slds-text-heading_medium slds-text-color_weak">Form is currently disabled.</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
